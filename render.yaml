# ==============================================================================
# CropCare AI - Render Deployment Blueprint
# ==============================================================================
# This file allows one-click or automated deployment on Render (https://render.com).

services:
  - type: web
    name: cropcare-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 2 -b 0.0.0.0:$PORT --timeout 120 app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
